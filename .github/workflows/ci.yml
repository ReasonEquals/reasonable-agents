name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly (Mon 06:17 UTC) — catch Claude Code plugin-spec drift on CC's release
    # cadence, not just on repo changes.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats
      - name: hook test suites
        run: bats tests/*.bats

  contraband:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: contraband gate
        run: bash tests/contraband.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (direct binary; full-history scan, push-range-immune)
        run: |
          set -euo pipefail
          # gitleaks-action derives a push commit range (<before>^..<after>) that is invalid on
          # the INITIAL push -- the root commit has no parent, so `<root>^` is an "ambiguous
          # argument" and the action fails the first push even with zero leaks. `gitleaks detect`
          # scans full history directly and is range-immune.
          ver=8.24.3
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --no-banner

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: validate plugin manifest
        run: |
          set -euo pipefail
          # 2.1.109 lacks --strict; latest CC (this runner) supports it. Detect and
          # degrade gracefully so the gate works on both.
          strict=""
          if claude plugin validate --help 2>&1 | grep -q -- '--strict'; then
            strict="--strict"
          fi
          # shellcheck disable=SC2086
          out="$(claude plugin validate $strict . 2>&1)"
          printf '%s\n' "$out"
          # Assert the command actually validated (guards a silently no-op flag).
          printf '%s' "$out" | grep -qi 'validation passed'
